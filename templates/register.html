<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<h2>Create Account</h2>

<form method="POST">

    <p>Username</p>

    <input
        type="text"
        name="username"
        required>

    <br><br>

    <p>Email</p>

    <input
        type="email"
        name="email"
        required>

    <br><br>

    <p>Password</p>

    <input
        type="password"
        name="password"
        required>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>
