<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h2>👤 User Profile</h2>
        </div>

        <div class="card-body">

            <h4>
                Username:
                {{ current_user.username }}
            </h4>

            <h5>
                Email:
                {{ current_user.email }}
            </h5>

            <hr>

            <p>
                Total Tasks:
                <strong>{{ total_tasks }}</strong>
            </p>

            <p>
                Completed Tasks:
                <strong>{{ completed_tasks }}</strong>
            </p>

            <p>
                Completion Rate:
                <strong>{{ completion_rate }}%</strong>
            </p>

            <a href="/change-password"
               class="btn btn-warning me-2">
                Change Password
            </a>

            <a href="/"
               class="btn btn-primary">
               Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
