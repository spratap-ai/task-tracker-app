<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<form method="POST">

    <p>Email</p>

    <input
        type="email"
        name="email"
        required>

    <br><br>

    <p>Password</p>

    <input
        type="password"
        name="password"
        required>

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
